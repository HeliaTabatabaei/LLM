services:

  api:
    build:
      context: .
      dockerfile: migration/Dockerfile
    container_name: adonis_chat
    ports:
      - "8000:8000"
    env_file:
       - .env
    volumes:
       - ./data:/app/data   
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_db
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
